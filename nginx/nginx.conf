events {
    worker_connections 1024;
}

http {
    # -----------------------------------------------------------------------
    # Upstream backend
    # -----------------------------------------------------------------------
    upstream backend {
        server backend:8000;
    }

    # -----------------------------------------------------------------------
    # Redirect HTTP -> HTTPS
    # -----------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------
    # HTTPS — main server block
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        # TLS certificate paths (mounted via docker volume)
        # Local dev: self-signed cert at nginx/certs/
        # GCP prod:  Let's Encrypt cert via Certbot
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # Proxy to FastAPI
        location / {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Forward W3C trace context headers
            proxy_pass_header  traceparent;
            proxy_pass_header  tracestate;
        }
    }
}
